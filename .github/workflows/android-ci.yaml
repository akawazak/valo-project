name: android verify

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/android-ci.yaml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/android-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-debug:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: backend/go.mod
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.77.2 --profile minimal --target aarch64-linux-android
          rustup default 1.77.2
      - uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK and NDK
        shell: pwsh
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          "NDK_HOME=$env:ANDROID_HOME\ndk\27.2.12479018" >> $env:GITHUB_ENV
          "ANDROID_NDK_HOME=$env:ANDROID_HOME\ndk\27.2.12479018" >> $env:GITHUB_ENV
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify shared frontend
        working-directory: frontend
        run: |
          npm test
          npx tsc --noEmit
      - name: Build ARM64 debug APK
        working-directory: frontend
        run: npm run android:build -- --debug --apk --target aarch64
      - name: Run Android unit and lint checks
        working-directory: frontend/src-tauri/gen/android
        run: .\gradlew.bat testDebugUnitTest lintDebug --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VantaVault-android-arm64-debug
          path: frontend/src-tauri/gen/android/app/build/outputs/apk/**/*debug*.apk
          if-no-files-found: error
