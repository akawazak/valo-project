name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.settings.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: 'Windows'
            platform: 'windows-latest'
            tauri-args: '--bundles nsis'
    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify backend
        working-directory: backend
        run: go test ./...

      - name: Verify frontend
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm run lint
          npm audit --omit=dev

      - name: Verify desktop
        working-directory: frontend
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Require updater signing key
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        if: ${{ env.SIGNING_KEY == '' }}
        shell: pwsh
        run: |
          throw "TAURI_SIGNING_PRIVATE_KEY is required for a production release."

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: frontend
          tagName: v__VERSION__
          releaseName: VantaVault v__VERSION__
          args: ${{ matrix.settings.tauri-args }}
          releaseBody: |
            ## VantaVault v__VERSION__

            ### Download
            - **Windows Installer:** `VantaVault_*_x64-setup.exe` — the supported per-user install. No administrator rights are required.
            - **Windows Portable:** `VantaVault-portable.exe` — run directly with no setup. Download a new portable file manually for future updates.

            ### Auto-update
            Installed copies check for updates automatically on launch and relaunch from the installed app location after an update.
            Portable copies intentionally do not use in-app updates, so they always run the exact file you downloaded.
          releaseDraft: false
          prerelease: false

      - name: Package portable EXE (Windows)
        if: matrix.settings.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.tauri.outputs.appVersion }}"
          if (!$version) { throw "No application version was returned by the Tauri build." }
          $binariesDir = "frontend/src-tauri/binaries"
          $releaseDir  = "frontend/src-tauri/target/release"
          $builtSidecar = Get-ChildItem "$binariesDir/valovault-backend*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$builtSidecar) { throw "Built backend sidecar not found in $binariesDir." }
          Copy-Item $builtSidecar.FullName "$releaseDir/valovault-backend.exe" -Force
          Copy-Item $builtSidecar.FullName "$releaseDir/valovault-backend-x86_64-pc-windows-msvc.exe" -Force
          $appExe = Get-ChildItem "$releaseDir/*.exe" | Where-Object Name -NotMatch 'backend|wix|light|candle|nsis' | Select-Object -First 1
          if (!$appExe) { throw "Portable app executable not found." }
          $env:VV_APP_EXE = $appExe.FullName
          $env:VV_BACKEND_EXE = $builtSidecar.FullName
          $env:VV_VERSION = $version
          rustc frontend/src-tauri/portable.rs -O -o VantaVault-portable.exe
          if (!(Test-Path VantaVault-portable.exe)) { throw "Portable EXE was not created." }
          gh release upload "v$version" VantaVault-portable.exe --repo akawazak/valo-project --clobber
