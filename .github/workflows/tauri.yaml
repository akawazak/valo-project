name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: 'windows-latest'
            go-target: './tmp/valovault-backend-x86_64-pc-windows-msvc.exe'
            tauri-args: '--bundle nsis'
          - platform: 'ubuntu-22.04'
            go-target: './tmp/valovault-backend-x86_64-unknown-linux-gnu'
            tauri-args: '--bundle deb,appimage'
    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod

      - name: Install Linux dependencies
        if: matrix.settings.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build backend sidecar
        working-directory: backend
        run: go build -o ${{ matrix.settings.go-target }} .

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: frontend
          tagName: v__VERSION__
          releaseName: ValoVault v__VERSION__
          args: ${{ matrix.settings.tauri-args }}
          releaseBody: |
            ## ValoVault v__VERSION__

            ### Download
            - **Windows Portable (recommended):** `ValoVault-Portable-x64.zip` — extract anywhere and run `ValoVault.exe`
            - **Windows Installer:** `ValoVault_*_x64-setup.exe` — per-user install, no admin required
            - **Linux AppImage:** `ValoVault_*_amd64.AppImage` — portable Linux execution
            - **Linux Debian Package:** `ValoVault_*_amd64.deb` — standard Linux install

            ### Auto-update
            Installed copies check for updates automatically on launch.
          releaseDraft: false
          prerelease: false

      - name: Package portable build
        if: matrix.settings.platform == 'windows-latest'
        shell: pwsh
        run: |
          $release = "frontend/src-tauri/target/release"
          $portable = "$release/ValoVault-Portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null

          $exe = Get-ChildItem "$release/*.exe" | Where-Object { $_.Name -notmatch 'backend|wix|light|candle|nsis' } | Select-Object -First 1
          if (-not $exe) { throw "App executable not found in $release" }

          Copy-Item $exe.FullName "$portable/ValoVault.exe" -Force
          Copy-Item "backend/tmp/valovault-backend-x86_64-pc-windows-msvc.exe" "$portable/" -Force
          Get-ChildItem "$release" -Filter "*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination $portable -Force
          if (Test-Path "$release/resources") {
            Copy-Item "$release/resources" "$portable/resources" -Recurse -Force
          }

          Compress-Archive -Path "$portable/*" -DestinationPath "ValoVault-Portable-x64.zip" -Force

      - name: Upload portable zip
        if: matrix.settings.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tauri.outputs.releaseTag }}" "ValoVault-Portable-x64.zip" --repo akawazak/valo-project --clobber
