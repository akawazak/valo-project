name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.settings.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        settings:
          - name: 'Windows'
            platform: 'windows-latest'
            tauri-args: '--bundles nsis'
          - name: 'Linux'
            platform: 'ubuntu-22.04'
            tauri-args: '--bundles deb,appimage'
    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod

      - name: Install Linux dependencies
        if: matrix.settings.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify backend
        working-directory: backend
        run: go test ./...

      - name: Verify frontend
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm run lint
          npm audit --omit=dev

      - name: Verify desktop
        working-directory: frontend
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Require updater signing key
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        if: ${{ env.SIGNING_KEY == '' }}
        shell: pwsh
        run: |
          throw "TAURI_SIGNING_PRIVATE_KEY is required for a production release."

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: frontend
          tagName: v__VERSION__
          releaseName: VantaVault v__VERSION__
          args: ${{ matrix.settings.tauri-args }}
          releaseBody: |
            ## VantaVault v__VERSION__

            ### Download
            - **Windows Portable (recommended):** `VantaVault-portable.exe` - run directly (no install)
            - **Windows Installer:** `VantaVault_*_x64-setup.exe` — per-user install, no admin required, includes auto-update
            - **Linux AppImage:** `VantaVault_*_amd64.AppImage` — portable Linux execution
            - **Linux Debian Package:** `VantaVault_*_amd64.deb` — standard Linux install

            ### Auto-update
            Installed copies check for updates automatically on launch.
          releaseDraft: false
          prerelease: false

      - name: Package portable exe (Windows)
        if: matrix.settings.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.tauri.outputs.appVersion }}"
          if (!$version) { Write-Host "No app version output, skipping portable upload."; exit 0 }
          $binariesDir = "frontend/src-tauri/binaries"
          $releaseDir  = "frontend/src-tauri/target/release"
          $builtSidecar = Get-ChildItem "$binariesDir/valovault-backend*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$builtSidecar) { throw "Built backend sidecar not found in $binariesDir." }
          Copy-Item $builtSidecar.FullName "$releaseDir/valovault-backend.exe" -Force
          Copy-Item $builtSidecar.FullName "$releaseDir/valovault-backend-x86_64-pc-windows-msvc.exe" -Force
          $appExe   = Get-ChildItem "$releaseDir/*.exe" | Where-Object Name -NotMatch 'backend|wix|light|candle|nsis' | Select-Object -First 1
          $sidecar  = Get-ChildItem "$releaseDir/valovault-backend*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$appExe -or !$sidecar) { throw "Portable app or sidecar executable not found." }
          $env:VV_APP_EXE    = $appExe.FullName
          $env:VV_BACKEND_EXE = $sidecar.FullName
          $env:VV_VERSION     = $version
          rustc frontend/src-tauri/portable.rs -O -o VantaVault-portable.exe
          if (!(Test-Path VantaVault-portable.exe)) { throw "Portable exe not created." }
          gh release upload "v$version" VantaVault-portable.exe --repo akawazak/valo-project --clobber
