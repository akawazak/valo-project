name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.settings.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: 'Windows'
            platform: 'windows-latest'
            go-target: './tmp/valovault-backend-x86_64-pc-windows-msvc.exe'
            tauri-args: '--bundles nsis'
          - name: 'Linux'
            platform: 'ubuntu-22.04'
            go-target: './tmp/valovault-backend-x86_64-unknown-linux-gnu'
            tauri-args: '--bundles deb,appimage'
    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod

      - name: Install Linux dependencies
        if: matrix.settings.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build backend sidecar
        working-directory: backend
        shell: bash
        run: |
          if [[ "${{ matrix.settings.platform }}" == "windows-latest" ]]; then
            go build -ldflags="-H windowsgui" -o ${{ matrix.settings.go-target }} .
          else
            go build -o ${{ matrix.settings.go-target }} .
          fi

      - name: Stage backend sidecar for Tauri
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/binaries
          cp "backend/${{ matrix.settings.go-target }}" "frontend/src-tauri/binaries/"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Disable updater signing if private key is missing
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        if: ${{ env.SIGNING_KEY == '' }}
        shell: pwsh
        run: |
          $configPath = "frontend/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          if ($config.bundle -and $config.bundle.createUpdaterArtifacts) {
            $config.bundle.createUpdaterArtifacts = $false
            $config | ConvertTo-Json -Depth 100 | Out-File $configPath -Encoding utf8
            Write-Host "Disabled updater signing (no TAURI_SIGNING_PRIVATE_KEY secret set)."
          }

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: frontend
          tagName: v__VERSION__
          releaseName: VantaVault v__VERSION__
          args: ${{ matrix.settings.tauri-args }}
          releaseBody: |
            ## VantaVault v__VERSION__

            ### Download
            - **Windows Portable (recommended):** `VantaVault-portable.zip` — extract anywhere, run `VantaVault.exe` (no install)
            - **Windows Installer:** `VantaVault_*_x64-setup.exe` — per-user install, no admin required, includes auto-update
            - **Linux AppImage:** `VantaVault_*_amd64.AppImage` — portable Linux execution
            - **Linux Debian Package:** `VantaVault_*_amd64.deb` — standard Linux install

            ### Auto-update
            Installed copies check for updates automatically on launch.
          releaseDraft: false
          prerelease: false

      - name: Package portable zip (Windows)
        if: matrix.settings.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.tauri.outputs.appVersion }}"
          if [[ -z "$version" ]]; then
            echo "No app version output, skipping portable upload."
            exit 0
          fi
          tag="v$version"
          releaseDir="frontend/src-tauri/target/release"

          echo "Release dir: $releaseDir"
          echo "Contents of release dir:"
          ls -la "$releaseDir" 2>&1 | head -40

          appExe=$(ls "$releaseDir"/*.exe 2>/dev/null | grep -vE 'backend|wix|light|candle|nsis' | head -n 1 || true)
          if [[ -z "$appExe" ]]; then
            echo "ERROR: app exe not found in $releaseDir"
            exit 1
          fi
          echo "App exe: $appExe"

          sidecar=$(ls "$releaseDir"/valovault-backend*.exe 2>/dev/null | head -n 1 || true)
          if [[ -z "$sidecar" ]]; then
            echo "ERROR: sidecar not found in $releaseDir"
            exit 1
          fi
          echo "Sidecar: $sidecar"

          # Stage into a clean directory with the canonical exe name.
          work="portable-build"
          rm -rf "$work" VantaVault-portable.zip
          mkdir -p "$work"
          cp "$appExe" "$work/VantaVault.exe"
          cp "$sidecar" "$work/"
          echo "Staged files:"
          ls -la "$work/"

          # Use Python for zipping — bulletproof, no shell quirks.
          python -c "
import os, sys, zipfile
src = os.path.abspath('portable-build')
dst = os.path.abspath('VantaVault-portable.zip')
with zipfile.ZipFile(dst, 'w', zipfile.ZIP_DEFLATED) as z:
    for name in os.listdir(src):
        full = os.path.join(src, name)
        if os.path.isfile(full):
            z.write(full, arcname=name)
            print(f'  added: {name} ({os.path.getsize(full)} bytes)')
print(f'wrote {dst} ({os.path.getsize(dst)} bytes)')
"

          if [[ ! -f VantaVault-portable.zip ]]; then
            echo "ERROR: zip not created"
            exit 1
          fi
          ls -la VantaVault-portable.zip

          gh release upload "$tag" VantaVault-portable.zip --repo akawazak/valo-project --clobber
          echo "Uploaded portable zip to $tag"
