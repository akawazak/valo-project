name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.settings.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: 'Windows'
            platform: 'windows-latest'
            go-target: './tmp/valovault-backend-x86_64-pc-windows-msvc.exe'
            tauri-args: '--bundles nsis'
          - name: 'Linux'
            platform: 'ubuntu-22.04'
            go-target: './tmp/valovault-backend-x86_64-unknown-linux-gnu'
            tauri-args: '--bundles deb,appimage'
    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod

      - name: Install Linux dependencies
        if: matrix.settings.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build backend sidecar
        working-directory: backend
        shell: bash
        run: |
          if [[ "${{ matrix.settings.platform }}" == "windows-latest" ]]; then
            go build -ldflags="-H windowsgui" -o ${{ matrix.settings.go-target }} .
          else
            go build -o ${{ matrix.settings.go-target }} .
          fi

      - name: Stage backend sidecar for Tauri
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/binaries
          cp "backend/${{ matrix.settings.go-target }}" "frontend/src-tauri/binaries/"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Disable updater signing if private key is missing
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        if: ${{ env.SIGNING_KEY == '' }}
        shell: pwsh
        run: |
          $configPath = "frontend/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          if ($config.bundle -and $config.bundle.createUpdaterArtifacts) {
            $config.bundle.createUpdaterArtifacts = $false
            $config | ConvertTo-Json -Depth 100 | Out-File $configPath -Encoding utf8
            Write-Host "Disabled updater signing (no TAURI_SIGNING_PRIVATE_KEY secret set)."
          }

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: frontend
          tagName: v__VERSION__
          releaseName: VantaVault v__VERSION__
          args: ${{ matrix.settings.tauri-args }}
          releaseBody: |
            ## VantaVault v__VERSION__

            ### Download
            - **Windows Portable (recommended):** `VantaVault-portable.exe` - run directly (no install)
            - **Windows Installer:** `VantaVault_*_x64-setup.exe` — per-user install, no admin required, includes auto-update
            - **Linux AppImage:** `VantaVault_*_amd64.AppImage` — portable Linux execution
            - **Linux Debian Package:** `VantaVault_*_amd64.deb` — standard Linux install

            ### Auto-update
            Installed copies check for updates automatically on launch.
          releaseDraft: false
          prerelease: false

      - name: Package portable exe (Windows)
        if: matrix.settings.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.tauri.outputs.appVersion }}"
          if (!$version) { Write-Host "No app version output, skipping portable upload."; exit 0 }
          $releaseDir = "frontend/src-tauri/target/release"
          $appExe = Get-ChildItem "$releaseDir/*.exe" | Where-Object Name -NotMatch 'backend|wix|light|candle|nsis' | Select-Object -First 1
          $sidecar = Get-ChildItem "$releaseDir/valovault-backend*.exe" | Select-Object -First 1
          if (!$appExe -or !$sidecar) { throw "Portable app or sidecar executable not found." }
          $env:VV_APP_EXE = $appExe.FullName
          $env:VV_BACKEND_EXE = $sidecar.FullName
          $env:VV_VERSION = $version
          rustc frontend/src-tauri/portable.rs -O -o VantaVault-portable.exe
          if (!(Test-Path VantaVault-portable.exe)) { throw "Portable exe not created." }
          gh release upload "v$version" VantaVault-portable.exe --repo akawazak/valo-project --clobber
