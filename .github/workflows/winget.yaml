name: winget

# Opens a winget-pkgs pull request for each published release.
# Needs: the first version (packaging/winget) merged into microsoft/winget-pkgs, a fork of
# winget-pkgs on this account, and a classic PAT (public_repo, workflow) saved as WINGET_TOKEN.
# Without the secret this job skips itself.
on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check for token
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: echo "present=$([ -n "$WINGET_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # main 2026-10-07
        if: steps.token.outputs.present == 'true'
        with:
          identifier: akawazak.VantaVault
          installers-regex: '_x64-setup\.exe$'
          max-versions-to-keep: 5
          token: ${{ secrets.WINGET_TOKEN }}
