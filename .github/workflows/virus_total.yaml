name: released

permissions:
  contents: read

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to scan
        required: true
        type: string

jobs:
  virustotal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download stable release executables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "false" ]]; then
            echo "VirusTotal scans require a published release." >&2
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" != "false" ]]; then
            echo "VirusTotal scans require a stable release." >&2
            exit 1
          fi
          mkdir release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.exe' --dir release-assets
          mapfile -t executables < <(find release-assets -maxdepth 1 -type f -name '*.exe' -size +0c | sort)
          if [[ "${#executables[@]}" -ne 2 ]]; then
            echo "Expected exactly two nonempty Windows executables, found ${#executables[@]}." >&2
            exit 1
          fi

      - name: VirusTotal Scan
        id: virustotal
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            release-assets/*.exe

      - name: Add VirusTotal links to release notes
        uses: actions/github-script@v7
        env:
          VT_ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const raw = process.env.VT_ANALYSIS || '';
            if (!raw.trim()) {
              core.setFailed('VirusTotal returned no analysis links.');
              return;
            }
            const links = raw.split(',').map((entry) => {
              const separator = entry.indexOf('=');
              if (separator <= 0) throw new Error(`Invalid VirusTotal output: ${entry}`);
              const path = entry.slice(0, separator).trim();
              const url = entry.slice(separator + 1).trim();
              const name = path.split(/[\\/]/).pop();
              return `- [${name}](${url})`;
            });
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            const start = '<!-- virustotal-results:start -->';
            const end = '<!-- virustotal-results:end -->';
            let body = release.body || '';
            const startAt = body.indexOf(start);
            if (startAt >= 0) {
              const endAt = body.indexOf(end, startAt);
              if (endAt >= 0) body = `${body.slice(0, startAt)}${body.slice(endAt + end.length)}`;
            }
            const block = `${start}\n### VirusTotal analysis\n${links.join('\n')}\n${end}`;
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body: `${body.trimEnd()}\n\n${block}\n`,
            });
