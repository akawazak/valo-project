name: released

permissions:
  contents: read

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to scan
        required: true
        type: string

jobs:
  virustotal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Require VirusTotal API key
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [[ -z "$VT_API_KEY" ]]; then
            echo "VT_API_KEY is not configured; VirusTotal scanning is optional." >&2
            exit 1
          fi

      - name: Download stable release executables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "false" ]]; then
            echo "VirusTotal scans require a published release." >&2
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" != "false" ]]; then
            echo "VirusTotal scans require a stable release." >&2
            exit 1
          fi
          mkdir release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.exe' --dir release-assets
          mapfile -t executables < <(find release-assets -maxdepth 1 -type f -name '*.exe' -size +0c | sort)
          if [[ "${#executables[@]}" -ne 2 ]]; then
            echo "Expected exactly two nonempty Windows executables, found ${#executables[@]}." >&2
            exit 1
          fi

      - name: Submit exact release executables to VirusTotal
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          expected_portable="VantaVault-portable.exe"
          expected_installer="VantaVault_${version}_x64-setup.exe"
          mapfile -t executables < <(find release-assets -maxdepth 1 -type f -name '*.exe' -printf '%f\n' | sort)
          if [[ "${executables[*]}" != "$expected_installer $expected_portable" && "${executables[*]}" != "$expected_portable $expected_installer" ]]; then
            printf 'Unexpected executable set: %s\n' "${executables[*]}" >&2
            exit 1
          fi
          : > virustotal-links.md
          for name in "${executables[@]}"; do
            response="$(curl --fail-with-body --silent --show-error \
              --request POST 'https://www.virustotal.com/api/v3/files' \
              --header "x-apikey: $VT_API_KEY" \
              --form "file=@release-assets/$name")"
            analysis_id="$(jq -er '.data.id | select(type == "string" and test("^[A-Za-z0-9_-]{20,}$"))' <<<"$response")"
            test -n "$analysis_id"
            sha256="$(sha256sum "release-assets/$name" | cut -d' ' -f1)"
            [[ "$sha256" =~ ^[a-f0-9]{64}$ ]]
            printf -- '- [%s](https://www.virustotal.com/gui/file/%s)\n' "$name" "$sha256" >> virustotal-links.md
          done

      - name: Add vetted VirusTotal links to release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [[ "$line" =~ ^-\ \[VantaVault[-_A-Za-z0-9.]+\.exe\]\(https://www\.virustotal\.com/gui/file/[a-f0-9]{64}\)$ ]]
          done < virustotal-links.md
          current="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          cleaned="$(printf '%s\n' "$current" | awk '
            /<!-- virustotal-results:start -->/ { skip=1; next }
            /<!-- virustotal-results:end -->/ { skip=0; next }
            !skip { print }
          ')"
          {
            printf '%s\n\n' "${cleaned%$'\n'}"
            printf '<!-- virustotal-results:start -->\n### VirusTotal analysis\n'
            cat virustotal-links.md
            printf '<!-- virustotal-results:end -->\n'
          } > release-body.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-body.md
