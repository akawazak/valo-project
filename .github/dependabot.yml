version: 2
# Tauri is updated by hand: its npm packages and Rust crates must share a major/minor
# version, and Dependabot can only bump one side per PR, which fails the Tauri build.
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '@tauri-apps/*'
    groups:
      frontend-minor-patches:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /frontend/src-tauri
    schedule:
      interval: weekly
    ignore:
      - dependency-name: 'tauri'
      - dependency-name: 'tauri-*'
    groups:
      tauri-rust-minor-patches:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patches:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
