version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patches:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /frontend/src-tauri
    schedule:
      interval: weekly
    groups:
      tauri-rust-minor-patches:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patches:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
